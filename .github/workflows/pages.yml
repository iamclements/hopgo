name: Deploy site

# Publishes the static marketing site (apps/site/public) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render the 1200x630 Open Graph image from its HTML source so the
      # published og:image always exists and stays in sync with the design.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-dependencies: true
      - name: Render OG image
        run: |
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1200,630 \
            --default-background-color=00000000 \
            --virtual-time-budget=4000 \
            --screenshot="apps/site/public/assets/og-image.png" \
            "file://$GITHUB_WORKSPACE/apps/site/public/assets/og-image.html"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
