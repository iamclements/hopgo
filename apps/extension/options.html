<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hopgo settings</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        max-width: 520px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.6rem;
        border: 1px solid #8884;
        border-radius: 6px;
        font: inherit;
      }
      .hint {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 0.25rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      button {
        margin-top: 1.25rem;
        font: inherit;
        border: 0;
        border-radius: 6px;
        padding: 0.5rem 0.9rem;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        margin-top: 0;
        background: #8883;
        color: inherit;
      }
      .msg {
        min-height: 18px;
        font-size: 13px;
        margin-top: 0.75rem;
      }
      .msg.error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>Hopgo settings</h1>

    <label for="shortDomain">Your short-link domain</label>
    <input id="shortDomain" type="url" placeholder="https://go.example.com" />
    <div class="hint">
      The domain where your Hopgo redirect Worker is deployed. Short links are built from this.
    </div>

    <label for="redirect">OAuth redirect URL</label>
    <div class="row">
      <input id="redirect" type="text" readonly />
      <button class="secondary" id="copyRedirect">Copy</button>
    </div>
    <div class="hint">
      Add this exact URL to your Cloudflare OAuth client's redirect URIs before signing in.
    </div>

    <button id="save">Save</button>
    <div class="msg" id="msg"></div>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
