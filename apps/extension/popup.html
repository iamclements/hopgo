<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hopgo</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .url {
        opacity: 0.7;
        word-break: break-all;
        margin-bottom: 8px;
        font-size: 12px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 6px;
        padding: 7px 10px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button.link {
        background: transparent;
        color: #2563eb;
        padding: 0;
      }
      button.secondary {
        background: #8883;
        color: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .msg {
        min-height: 18px;
        font-size: 12px;
        margin: 8px 0;
      }
      .msg.error {
        color: #dc2626;
      }
      .result {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .result code {
        flex: 1;
        word-break: break-all;
      }
      ul {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        border-top: 1px solid #8883;
      }
      li {
        padding: 6px 0;
        border-bottom: 1px solid #8882;
        font-size: 12px;
      }
      li a {
        color: #2563eb;
        text-decoration: none;
      }
      .recent-top {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .recent-target {
        opacity: 0.6;
        margin-top: 2px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recent-target.expanded {
        white-space: normal;
        word-break: break-all;
      }
      .recent-toggle {
        font-size: 11px;
        margin-top: 2px;
      }
      .recent-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
        margin-top: 12px;
      }
      .footer {
        margin-top: 12px;
        text-align: right;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <h1>Hopgo</h1>
      <button class="link" id="settings">Settings</button>
    </div>
    <div class="url" id="current">Reading current tab...</div>
    <button id="connect">Sign in with Cloudflare</button>
    <input
      id="slug"
      class="hidden"
      type="text"
      placeholder="custom slug (optional)"
      pattern="[A-Za-z0-9_-]+"
      style="
        width: 100%;
        padding: 7px 10px;
        margin-bottom: 6px;
        border: 1px solid #8884;
        border-radius: 6px;
        font: inherit;
        box-sizing: border-box;
      "
    />
    <button id="shorten" class="hidden">Shorten this tab</button>
    <div class="msg" id="msg"></div>
    <div class="result hidden" id="result">
      <code id="short"></code><button class="secondary" id="copy">Copy</button>
    </div>
    <div class="recent-title">Your links</div>
    <ul id="links"></ul>
    <div class="footer">
      <button class="link hidden" id="signout">Sign out</button>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
