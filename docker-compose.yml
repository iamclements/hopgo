# Hopgo control plane (management API + portal).
# This container is DISPOSABLE: the redirects live on Cloudflare's edge, not here.
# Wiping and recreating this container loses zero links.
#
# The control-plane image is built in a later PR (feat/control-plane-api). This file
# is the homelab entrypoint and is kept in docs-sync from day one.
services:
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    image: hopgo/control-plane:latest
    container_name: hopgo
    restart: unless-stopped
    # Bind to LAN only. For remote admin use a Cloudflare Tunnel + Access, not an open port.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Map your host user so files written by the container stay yours.
      - PUID=1000
      - PGID=1000
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_KV_NAMESPACE_ID=${CF_KV_NAMESPACE_ID}
      - HOPGO_TENANT_ID=${HOPGO_TENANT_ID:-local}
      - HOST=0.0.0.0
      - PORT=8787
    env_file:
      - .env
